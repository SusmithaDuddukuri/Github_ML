[tool.poetry]
name = "terrasignal"
version = "0.1.0"
description = "Geospatial machine intelligence platform"
authors = ["TerraSignal"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115,<1.0"
uvicorn = {extras = ["standard"], version = ">=0.30,<1.0"}
sqlalchemy = ">=2.0,<3.0"
pydantic = {extras = ["email"], version = ">=2.8,<3.0"}
pwdlib = {extras = ["argon2"], version = ">=0.2,<1.0"}
PyJWT = ">=2.9,<3.0"
python-multipart = ">=0.0.9"
python-dotenv = ">=1.0"
httpx = ">=0.27"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
